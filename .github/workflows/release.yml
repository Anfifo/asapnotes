# Turns a version tag into a draft GitHub Release with the Windows installer attached.
# Draft on purpose: the release is looked at before it is published. Tag with the version
# the manifests carry (`v0.1.0` for version 0.1.0); the action reads the version from
# tauri.conf.json and names the release after it.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The runner's PowerShell may block npm's .ps1 shim the same way a fresh Windows
      # machine does; bash never asks.
      - run: npm ci
        shell: bash

      # The installer ships THIRD-PARTY-NOTICES.txt; regenerating it here keeps it
      # current with the lockfiles, and fails the release on a license not listed
      # in notices/about.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - run: npm run notices
        shell: bash

      # The transcription engine ships as its own release asset, which the app
      # downloads on request and checks against the digest and size exported here
      # for the app build. The C runtime is linked in so the engine starts on a
      # machine without the VC++ redistributable; its own target dir keeps the
      # RUSTFLAGS change from invalidating the app's build cache.
      - name: Build the transcription engine
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_DIR: src-tauri/target/engine
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --features transcribe --bin asapnotes-transcribe
          cp src-tauri/target/engine/release/asapnotes-transcribe.exe asapnotes-transcribe-windows-x64.exe
          echo "ASAPNOTES_TRANSCRIBE_SHA256=$(sha256sum asapnotes-transcribe-windows-x64.exe | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "ASAPNOTES_TRANSCRIBE_BYTES=$(stat -c %s asapnotes-transcribe-windows-x64.exe)" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "asapnotes v__VERSION__"
          releaseBody: >
            Windows installer. Unsigned for now: Windows shows an "unrecognized app"
            warning; choose "More info" and then "Run anyway".
          releaseDraft: true
          prerelease: false

      # A fresh Windows install has no VC++ runtime, so no shipped exe may import it.
      # The app and the MCP helper get the static runtime from the Tauri build.
      - name: Check that no exe needs the VC++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $exes = "src-tauri/target/release/asapnotes.exe", "src-tauri/target/release/asapnotes-mcp.exe", "asapnotes-transcribe-windows-x64.exe"
          $bad = foreach ($exe in $exes) {
            & $dumpbin /dependents $exe | Select-String -Pattern "(vcruntime|msvcp)\d+" | ForEach-Object { "$exe needs $($_.Line.Trim())" }
          }
          if ($bad) { $bad; exit 1 }

      - name: Attach the engine to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          curl --fail -sS -X POST
          -H "Authorization: Bearer $GITHUB_TOKEN"
          -H "Content-Type: application/octet-stream"
          --data-binary @asapnotes-transcribe-windows-x64.exe
          "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=asapnotes-transcribe-windows-x64.exe"
