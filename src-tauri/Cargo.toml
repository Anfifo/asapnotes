[package]
name = "asapnotes"
version = "0.1.0"
description = "Instant-capture markdown notes: resident tray app summoned by a global hotkey"
authors = ["Anfifo"]
edition = "2021"
# The crate builds two binaries (app + MCP helper), so the bare `cargo run`
# that `tauri dev` invokes has to be told which one is the app.
default-run = "asapnotes"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asapnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recycle bin for delete_note — notes are user-owned files, never hard-deleted.
trash = "5"
# Gitignore-syntax matching for a project's `files` rules. The promise to the
# user is ".gitignore pattern syntax", and the anchoring/negation corner cases
# are exactly where a hand-rolled matcher would quietly diverge from it.
ignore = "0.4"
# Known-folder resolution for the MCP helper binary, which has no AppHandle to
# ask. Pinned to the same version Tauri itself resolves paths through, because
# a helper that finds a *different* notes root than the app serves a different
# corpus and nothing looks wrong.
dirs = "6"
# Diffs for the recent-changes view. A user-facing diff lives or dies on hunk
# readability, which is exactly where a hand-rolled Myers would spend its
# budget — same reasoning as `ignore` above.
similar = { version = "2", features = ["inline"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
