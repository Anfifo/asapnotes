[package]
name = "asapnotes"
version = "0.1.0"
description = "Instant-capture markdown notes: resident tray app summoned by a global hotkey"
authors = ["Anfifo"]
license = "MIT"
repository = "https://github.com/Anfifo/asapnotes"
edition = "2021"
# The crate builds two binaries (app + MCP helper), so the bare `cargo run`
# that `tauri dev` invokes has to be told which one is the app.
default-run = "asapnotes"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asapnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recycle bin for delete_note — notes are user-owned files, never hard-deleted.
trash = "5"
# Gitignore-syntax matching for a project's `files` rules. The promise to the
# user is ".gitignore pattern syntax", and the anchoring/negation corner cases
# are exactly where a hand-rolled matcher would quietly diverge from it.
ignore = "0.4"
# Known-folder resolution for the MCP helper binary, which has no AppHandle to
# ask. Pinned to the same version Tauri itself resolves paths through, because
# a helper that finds a *different* notes root than the app serves a different
# corpus and nothing looks wrong.
dirs = "6"
# Diffs for the recent-changes view. A user-facing diff lives or dies on hunk
# readability, which is exactly where a hand-rolled Myers would spend its
# budget — same reasoning as `ignore` above.
similar = { version = "2", features = ["inline"] }
# Meeting recording. Capture (microphone + playback loopback), the Opus voice
# codec, and its Ogg container. None of it runs — or holds memory — until a
# recording starts. Building the codec needs cmake on PATH (see CLAUDE.md).
cpal = "0.16"
audiopus = "0.2"
ogg = "0.9"
# Transcription add-on downloads: the engine from this app's release, models
# from their publisher, each checked against a digest this build carries. Only
# the download buttons in Settings reach the network.
ureq = "3"
sha2 = "0.10"
# Transcription engine, only in the `asapnotes-transcribe` helper and only
# with the `transcribe` feature. The app never links whisper.cpp: the helper
# is an add-on the app downloads on request, so a default build and a default
# install carry none of it. Building it needs cmake, like the Opus codec.
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }

[features]
transcribe = ["dep:whisper-rs"]
# GPU build of the engine. Needs the Vulkan SDK at build time.
transcribe-vulkan = ["transcribe", "whisper-rs/vulkan"]

[[bin]]
name = "asapnotes-transcribe"
path = "src/bin/asapnotes-transcribe.rs"
required-features = ["transcribe"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
